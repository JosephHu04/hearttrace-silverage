name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**", "chore/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-repository:
    name: validate-repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify required project documents
        run: |
          test -f README.md
          test -f docs/architecture.md
          test -f docs/api-contract.md
          test -f docs/decision-log.md
      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD
      - name: Check Qwen worker syntax
        run: python3 -m py_compile services/worker/qwen_analysis.py services/worker/qwen_evaluate.py services/worker/analysis_worker.py services/worker/notification_worker.py

  build-family:
    name: build-family
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/family
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/family/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build and type-check family application
        run: npm run build

  build-elder:
    name: build-elder
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/elder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/elder/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build and type-check elder application
        run: npm run build

  build-admin:
    name: build-admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/admin/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and type-check admin application
        run: pnpm run build

  test-api:
    name: test-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt
      - name: Install API dependencies
        run: pip install -r requirements-dev.txt
      - name: Run API tests
        run: pytest
      - name: Verify database migration
        env:
          DATABASE_URL: sqlite+pysqlite:///./ci-migration.db
          SEED_DEMO_DATA: "false"
        run: |
          alembic upgrade head
          alembic check
